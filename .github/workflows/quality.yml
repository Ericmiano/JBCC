name: Quality checks
on: [push, pull_request]
jobs:
  checks:
    # Playwright 1.56 cannot install browser system packages on Ubuntu 26, which ubuntu-latest now uses.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fails on high or critical advisories in packages the live server ships with.
      - run: bun audit --prod --audit-level=high
      - run: bunx playwright install --with-deps chromium
      # vite.config.ts pins the dev server to port 8080.
      - run: bun run dev & npx wait-on -t 120000 http://localhost:8080
      # Full end-to-end suite in Chromium; the accessibility workflow covers Firefox and WebKit.
      - run: bun run test:e2e
      # Lighthouse measures the production build, served through deploy/app.js as on DirectAdmin.
      - run: bun run build
      - run: |
          cp deploy/app.js deploy/package.json .output/
          PORT=4173 node .output/app.js &
          npx wait-on -t 60000 http://localhost:4173
      # Security headers, method and body limits, sitemap and 404s from deploy/app.js.
      # Failures are repeated as annotations so they show on the run page without opening the log.
      - run: |
          node --test tests/deploy/server.test.mjs 2>&1 | tee deploy-tests.log; status=${PIPESTATUS[0]}
          [ "$status" = 0 ] || grep -E "not ok|Error|expected|actual" deploy-tests.log | head -8 | sed 's/^/::error title=Server checks::/'
          exit "$status"
      # 50 concurrent visitors for 20 seconds; fails on any 5xx or a p95 over one second.
      - run: node scripts/stress.mjs http://localhost:4173 50 20
      # Thresholds: accessibility >= 94, mobile performance >= 50 (production scores 64–70 locally).
      - run: bun run test:lighthouse
        env: { LH_BASE_URL: "http://localhost:4173", LH_MIN_A11Y: "0.94", LH_MIN_PERF: "0.5" }
