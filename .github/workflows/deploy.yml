name: Deploy
# Staging deploys automatically once "Quality checks" passes on main.
# The live site deploys only when run by hand: Actions → Deploy → Run workflow → production.
on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

# Least privilege: no workflow writes to the repository.
permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # GitHub environment: holds DEPLOY_APP_DIR and, for production, any required approvals.
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - name: Check deployment settings
        id: settings
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: |
          if [ -z "$FTP_PASSWORD" ] || [ -z "$DEPLOY_APP_DIR" ]; then
            echo "::notice::Deployment skipped: add the FTP_USER and FTP_PASSWORD secrets and the DEPLOY_APP_DIR variable (see README, Deploying)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.settings.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.settings.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - if: steps.settings.outputs.ready == 'true'
        run: bun run build
      - name: Deploy to ${{ inputs.target || 'staging' }}
        if: steps.settings.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: bash scripts/deploy-ftp.sh
