name: Accessibility regression
on:
  pull_request:

concurrency:
  group: a11y-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: no workflow writes to the repository.
permissions:
  contents: read

jobs:
  a11y:
    name: a11y (${{ matrix.browser }})
    # Pinned so a runner OS change (ubuntu-latest moved to Ubuntu 26) cannot break the browser install; move deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Report every engine's result even when one fails.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      # Ubuntu mirrors sometimes answer 503; refresh the package lists and retry instead of failing the run.
      - run: for attempt in 1 2 3; do sudo apt-get update -q && bunx playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "Browser install failed (attempt $attempt), retrying"; sleep 30; done; exit 1
      # Ask JBCC is shown only with a gateway configured; the stub gateway switches it on with fixed answers.
      - run: node tests/support/stub-gateway.mjs & ASK_GATEWAY_URL=http://localhost:9911/anthropic bun run dev & npx wait-on -t 120000 http://localhost:8080
      # "github" reporter annotates each failing test on the pull request.
      - run: bunx playwright test tests/e2e/accessibility.spec.ts --project=${{ matrix.browser }} --reporter=github,html
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
